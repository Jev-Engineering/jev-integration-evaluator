[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-independent-registered-dual"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = ["jev-integration-evaluator==1.3.0.dev12"]

[project.scripts]
registered-dual = "registered_dual.console:main_alpha"
registered-dual-queue = "registered_dual.console:main_queue"

[tool.setuptools.packages.find]
where = ["src"]
include = ["registered_dual*"]

[tool.setuptools.package-data]
registered_dual = ["*.lock", "*.json"]
