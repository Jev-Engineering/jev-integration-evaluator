name: Validate skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  connected-node24-qualification:
    # Disposable Linux runner; acquisition is online, all installed host tests
    # use the explicit wheelhouse and fake protocol transport only.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
      - name: Acquire trusted TypeScript and offline wheelhouse
        run: |
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/jev-trusted-tooling"
          npm install --prefix "$RUNNER_TEMP/jev-trusted-tooling" \
            --ignore-scripts --no-audit --no-fund --package-lock=false typescript@5.8.3
          python -m pip install -e ".[test]" wheel
          python scripts/prepare_template_wheelhouse.py --out "$RUNNER_TEMP/jev-template-wheelhouse"
          echo "JEV_TRUSTED_TYPESCRIPT_PACKAGE=$RUNNER_TEMP/jev-trusted-tooling/node_modules/typescript" >> "$GITHUB_ENV"
          echo "JEV_TEMPLATE_WHEELHOUSE=$RUNNER_TEMP/jev-template-wheelhouse" >> "$GITHUB_ENV"
      - name: Verify exact native toolchain before required tests
        run: |
          python - <<'PY'
          import shutil
          import sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from test_node_template_installation import native_tools
          from test_node_template_installed_upgrade import (NODE_SHA256, NPM_CLI_SHA256,
              NPM_TREE_SHA256, TRUSTED_TYPESCRIPT_TREE_SHA256)
          from jev_integration_evaluator.io import digest, file_hash
          from jev_integration_evaluator.template_node_installation import _tree
          tools = native_tools()
          if tools is None:
              raise SystemExit('exact Node 24.18.0/npm 11.16.0 unavailable')
          node, npm = tools
          compiler = Path(__import__('os').environ['JEV_TRUSTED_TYPESCRIPT_PACKAGE'])
          actual = (file_hash(node), file_hash(npm), digest(_tree(npm.parent.parent)),
                    digest(_tree(compiler)))
          expected = (NODE_SHA256, NPM_CLI_SHA256, NPM_TREE_SHA256,
                      TRUSTED_TYPESCRIPT_TREE_SHA256)
          if actual != expected:
              raise SystemExit('exact native toolchain bytes changed')
          print('exact pinned Node/npm/TypeScript toolchain verified')
          PY
      - name: Exercise installed formats, connected faults and native runtime
        run: |
          env -u TYPESAFE_API_KEY python -m pytest -q \
            tests/test_node_template_installed_cli_formats.py \
            tests/test_node_template_connected.py \
            tests/test_node_template_connected_faults.py \
            tests/test_node_template_installation.py \
            tests/test_node_template_installed_commonjs.py \
            tests/test_node_template_installed_esm.py \
            tests/test_node_template_installed_upgrade.py \
            tests/test_node_template_installed_recovery.py \
            --junitxml="$RUNNER_TEMP/jev-connected-installed.xml"
          node --test --test-reporter=tap tests/native_js_runtime.test.cjs \
            > "$RUNNER_TEMP/jev-native-node.tap"
          cat "$RUNNER_TEMP/jev-native-node.tap"
          python - "$RUNNER_TEMP/jev-connected-installed.xml" "$RUNNER_TEMP/jev-native-node.tap" <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          failed = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          tap = open(sys.argv[2], encoding='utf-8').read()
          def count(name):
              match = re.search(r'^# ' + name + r' (\d+)$', tap, re.M)
              return int(match.group(1)) if match else -1
          print(f'installed: {tests} tests, {skipped} skipped, {failed} failed; '
                f'native: {count("tests")} tests, {count("skipped")} skipped, {count("fail")} failed')
          if tests != 27 or skipped or failed or count('tests') != 19 or count('skipped') or count('fail'):
              raise SystemExit('required installed/native Node 24 qualification incomplete')
          PY
  native-runner-qualification:
    # GitHub-hosted Ubuntu jobs receive a fresh VM. This job has no secrets,
    # checkout credentials, host mounts, or access to private target data.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install evaluator and inspect privileged prerequisites
        run: |
          python -m pip install -e ".[test]"
          test "$(uname -m)" = x86_64
          test -e /lib/x86_64-linux-gnu/libseccomp.so.2 -o -e /usr/lib/x86_64-linux-gnu/libseccomp.so.2
          python -c 'import os,platform,sys; print(platform.platform(), sys.version, sys.executable, "uid", os.getuid())'
      - name: Exercise required isolation cases with no skipped tests
        env:
          JEV_NATIVE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          test -x "$JEV_NATIVE_PYTHON"
          sudo -- "$JEV_NATIVE_PYTHON" scripts/check_native_runner_environment.py
          sudo -- "$JEV_NATIVE_PYTHON" -m pytest -q tests/test_isolated_python_runner.py tests/test_repository_native_run.py tests/test_adaptation_native.py tests/test_adaptation_prerequisite_native.py tests/test_adaptation_combined_review.py --junitxml="$RUNNER_TEMP/native-runner.xml"
          python - "$RUNNER_TEMP/native-runner.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          failed = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          print(f'native cases: collected={tests} skipped={skipped} failed={failed}')
          if tests < 124 or skipped or failed:
              raise SystemExit('native isolation qualification incomplete')
          PY
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record Linux test runtime identity
        run: python -c "import platform,sys; print(platform.platform()); print(sys.version); print(sys.executable)"
      - run: python -m pip install -e ".[test]"
      - name: Prepare explicit offline template wheelhouse
        if: matrix.python == '3.13'
        run: |
          python -m pip install wheel
          python scripts/prepare_template_wheelhouse.py --out "$RUNNER_TEMP/jev-template-wheelhouse"
          echo "JEV_TEMPLATE_WHEELHOUSE=$RUNNER_TEMP/jev-template-wheelhouse" >> "$GITHUB_ENV"
          # The independent Alpha, work-queue and dual installed journeys need an
          # explicit interpreter and wheelhouse. Without these they skip silently.
          interpreter="$(python -c 'import sys; print(sys.executable)')"
          for host in REGISTERED_ALPHA WORK_QUEUE DUAL; do
            echo "JEV_${host}_INSTALLED_PYTHON=$interpreter" >> "$GITHUB_ENV"
            echo "JEV_${host}_WHEELHOUSE=$RUNNER_TEMP/jev-template-wheelhouse" >> "$GITHUB_ENV"
          done
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: python -m pytest -q --junitxml="$RUNNER_TEMP/jev-tests.xml"
      - name: Reject skipped, missing or failed installed independent-host journeys
        if: matrix.python == '3.13'
        run: >-
          python scripts/check_required_cases.py
          --junit "$RUNNER_TEMP/jev-tests.xml"
          --modules-file .github/required-installed-journeys.txt
      - run: node --test tests/js_transform.test.cjs
      - run: python scripts/validate_package.py
      - run: python scripts/validate_package.py --check-manifest
      - run: python scripts/run_v11_demo.py --out "$RUNNER_TEMP/jev-v11-demo"
      - run: python scripts/run_v12_demo.py --out "$RUNNER_TEMP/jev-v12-demo"
      - run: python -I scripts/run_capability_demo.py --out "$RUNNER_TEMP/jev-discovery-demo"
      - run: python scripts/run_selection_demo.py --out "$RUNNER_TEMP/jev-selection-demo" --verify-synthetic-lifecycle
      - run: python -I scripts/run_placement_selection_demo.py --out "$RUNNER_TEMP/jev-scope-demo"
      - run: python -I scripts/run_repository_conclusion_demo.py --out "$RUNNER_TEMP/jev-conclusion-demo"

      - run: python scripts/run_implementation_demo.py --out "$RUNNER_TEMP/jev-implementation-demo"
      - run: python -m pytest -q tests/test_repository_run.py tests/test_repository_run_wheel.py
      - run: python scripts/run_repository_session_demo.py --out "$RUNNER_TEMP/jev-repository-session-demo"
  windows-discovery:
    # Hosted Windows runners are disposable and have no repository secrets.
    # Enable the two OS features needed by the real symlink and long-path fixtures.
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record Windows test runtime identity
        run: python -c "import platform,sys; print(platform.platform()); print(sys.version); print(sys.executable)"
      - name: Provision native Windows filesystem fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $devMode -Force | Out-Null
          New-ItemProperty -Path $devMode -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord -Value 1 -Force | Out-Null
          $fileSystem = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          New-ItemProperty -Path $fileSystem -Name LongPathsEnabled `
            -PropertyType DWord -Value 1 -Force | Out-Null
      - run: python -m pip install -e ".[test]"
      - name: Execute all required native Windows discovery cases
        env:
          JEV_REQUIRE_WINDOWS_SYMLINKS: "1"
        run: python -m pytest -q tests/test_repository_discovery_windows.py --junitxml "$env:RUNNER_TEMP\windows-discovery.xml"
      - name: Reject skipped or missing native Windows cases
        run: |
          python -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); s=[r] if r.tag=='testsuite' else list(r.findall('testsuite')); n=sum(int(x.get('tests',0)) for x in s); k=sum(int(x.get('skipped',0)) for x in s); f=sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s); print(f'native Windows discovery cases: collected={n} skipped={k} failed={f}'); sys.exit(1 if n < 19 or k or f else 0)" "$env:RUNNER_TEMP\windows-discovery.xml"
  windows-template-delivery:
    # Native delivery runs on a disposable Server 2022 VM with no secrets.
    # These synthetic off-mode fixtures do not grant provider authority.
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    steps:
      - name: Preserve committed bytes in the disposable checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record native delivery runtime identity
        run: |
          git config --get core.autocrlf
          python -c "import platform,sys; print(platform.platform()); print(sys.version); print(sys.executable)"
      - name: Provision disposable filesystem fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $devMode -Force | Out-Null
          New-ItemProperty -Path $devMode -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord -Value 1 -Force | Out-Null
          $fileSystem = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          New-ItemProperty -Path $fileSystem -Name LongPathsEnabled `
            -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Prepare declared development dependencies and offline wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -e ".[test]" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'jev-windows-template-wheelhouse'
          python scripts/prepare_template_wheelhouse.py --out $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JEV_WINDOWS_TEMPLATE_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute required native delivery and installed-host cases
        run: >-
          python -m pytest -q tests/test_windows_template_preflight.py
          tests/test_windows_template_package_inputs.py tests/test_windows_template_owned.py
          tests/test_windows_template_session.py tests/test_windows_template_delivery.py
          tests/test_windows_template_run.py tests/test_windows_template_install_faults.py
          tests/test_windows_template_install_death.py tests/test_windows_source_mutation.py
          -k "not non_windows"
          --junitxml "$env:RUNNER_TEMP\windows-template-delivery.xml"
      - name: Reject skipped or missing required delivery cases
        run: |
          python -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); s=[r] if r.tag=='testsuite' else list(r.findall('testsuite')); n=sum(int(x.get('tests',0)) for x in s); k=sum(int(x.get('skipped',0)) for x in s); f=sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s); print(f'native Windows delivery cases: collected={n} skipped={k} failed={f}'); sys.exit(1 if n < 91 or k or f else 0)" "$env:RUNNER_TEMP\windows-template-delivery.xml"
      - run: python scripts/validate_package.py --check-manifest
  windows-connected-shadow:
    # Disposable Server qualification uses a local TLS fixture and synthetic issuer.
    # No JEV provider credential or live endpoint is supplied to these jobs.
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13", "3.14"]
    env:
      TYPESAFE_API_KEY: ""
    steps:
      - name: Preserve committed bytes in the disposable checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Record native connected runtime and synthetic issuer identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --get core.autocrlf
          python -c "import platform,sys; print(platform.platform()); print(sys.version); print(sys.executable)"
          $issuer = 'C:\Program Files\Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $issuer -PathType Leaf)) { throw 'Declared synthetic issuer tooling absent' }
          (Get-FileHash -LiteralPath $issuer -Algorithm SHA256).Hash
      - name: Provision disposable native filesystem fixture settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $devMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $devMode -Force | Out-Null
          New-ItemProperty -Path $devMode -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord -Value 1 -Force | Out-Null
          $fileSystem = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          New-ItemProperty -Path $fileSystem -Name LongPathsEnabled `
            -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Prepare declared dependencies and exact offline wheels
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -e ".[test]" wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelhouse = Join-Path $env:RUNNER_TEMP 'jev-windows-connected-wheelhouse'
          python scripts/prepare_template_wheelhouse.py --out $wheelhouse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "JEV_WINDOWS_TEMPLATE_WHEELHOUSE=$wheelhouse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise required native installed connected shadow and faults
        run: >-
          python -m pytest -q tests/test_windows_connected_verify.py
          tests/test_windows_template_connected.py
          --junitxml "$env:RUNNER_TEMP\windows-connected-shadow.xml"
      - name: Reject missing, failed or skipped native connected cases
        run: |
          python -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); s=[r] if r.tag=='testsuite' else list(r.findall('testsuite')); n=sum(int(x.get('tests',0)) for x in s); k=sum(int(x.get('skipped',0)) for x in s); f=sum(int(x.get('failures',0))+int(x.get('errors',0)) for x in s); print(f'native connected cases: collected={n} skipped={k} failed={f}'); sys.exit(1 if n < 3 or k or f else 0)" "$env:RUNNER_TEMP\windows-connected-shadow.xml"
      - run: python scripts/validate_package.py --check-manifest
  python-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python scripts/validate_package.py --check-manifest
      - run: python -m pytest -q tests/test_executable_recipes.py tests/test_executable_runtime.py tests/test_executable_safety.py tests/test_executable_cli.py tests/test_executable_wheel.py tests/test_executable_host_boundaries.py tests/test_executable_source_scope.py tests/test_executable_verification_identity.py tests/test_executable_failure_receipts.py tests/test_executable_source_fidelity.py tests/test_executable_command_receipts.py
      - run: python -m pytest -q tests/test_capabilities.py tests/test_capabilities_adversarial.py tests/test_capabilities_examples.py tests/test_capabilities_cli.py tests/test_capabilities_wheel.py
      - run: python scripts/run_implementation_demo.py --out "$RUNNER_TEMP/jev-python-only-implementation"
      - run: python -m pytest -q tests/test_nomination_inventory.py tests/test_repository_discovery_cli.py tests/test_repository_discovery_wheel.py tests/test_capabilities_bridge_guards.py tests/test_review_gate_invariants.py
      - run: python -m pytest -q tests/test_placement_selection.py tests/test_placement_selection_cli.py tests/test_placement_selection_wheel.py tests/test_inputs_optimizer.py
      - run: python -m pytest -q tests/test_repository_placement_selection.py tests/test_repository_placement_wheel.py tests/test_scope_review_conflicts.py tests/test_placement_review_consistency.py tests/test_placement_review_consistency_cli.py
      - run: python -m pytest -q tests/test_repository_conclusion.py tests/test_repository_conclusion_cli.py tests/test_repository_conclusion_wheel.py
      - run: python -m pytest -q tests/test_repository_run.py tests/test_repository_run_wheel.py
      - run: python scripts/run_repository_session_demo.py --out "$RUNNER_TEMP/jev-python-only-repository-session"
      - run: python -I scripts/run_placement_selection_demo.py --out "$RUNNER_TEMP/jev-python-only-scope"
      - run: python -I scripts/run_repository_conclusion_demo.py --out "$RUNNER_TEMP/jev-python-only-conclusion"
      - run: python scripts/run_selection_demo.py --out "$RUNNER_TEMP/jev-python-only-selection" --verify-synthetic-lifecycle
      - run: python -I scripts/run_capability_demo.py --out "$RUNNER_TEMP/jev-python-only-discovery"
