name: Validate skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native-runner-qualification:
    # GitHub-hosted Ubuntu jobs receive a fresh VM. This job has no secrets,
    # checkout credentials, host mounts, or access to private target data.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install evaluator and inspect privileged prerequisites
        run: |
          python -m pip install -e ".[test]"
          test "$(uname -m)" = x86_64
          test -e /lib/x86_64-linux-gnu/libseccomp.so.2 -o -e /usr/lib/x86_64-linux-gnu/libseccomp.so.2
          python -c 'import os,platform,sys; print(platform.platform(), sys.version, sys.executable, "uid", os.getuid())'
      - name: Exercise required isolation cases with no skipped tests
        env:
          JEV_NATIVE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          test -x "$JEV_NATIVE_PYTHON"
          sudo -- "$JEV_NATIVE_PYTHON" -c 'import json; from jev_integration_evaluator.runners.isolated_python import environment_identity; print(json.dumps(environment_identity(), sort_keys=True))'
          sudo -- "$JEV_NATIVE_PYTHON" -m pytest -q tests/test_isolated_python_runner.py --junitxml="$RUNNER_TEMP/native-runner.xml"
          python - "$RUNNER_TEMP/native-runner.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          tests = sum(int(s.get('tests', 0)) for s in suites)
          skipped = sum(int(s.get('skipped', 0)) for s in suites)
          failed = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
          print(f'native cases: collected={tests} skipped={skipped} failed={failed}')
          if tests < 103 or skipped or failed:
              raise SystemExit('native isolation qualification incomplete')
          PY
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: python -m pytest -q
      - run: python scripts/validate_package.py --check-manifest
      - run: python scripts/run_v11_demo.py --out "$RUNNER_TEMP/jev-v11-demo"
      - run: python scripts/run_v12_demo.py --out "$RUNNER_TEMP/jev-v12-demo"
      - run: python -I scripts/run_capability_demo.py --out "$RUNNER_TEMP/jev-discovery-demo"
      - run: python scripts/run_selection_demo.py --out "$RUNNER_TEMP/jev-selection-demo" --verify-synthetic-lifecycle
      - run: python -I scripts/run_placement_selection_demo.py --out "$RUNNER_TEMP/jev-scope-demo"
      - run: python -I scripts/run_repository_conclusion_demo.py --out "$RUNNER_TEMP/jev-conclusion-demo"

      - run: python scripts/run_implementation_demo.py --out "$RUNNER_TEMP/jev-implementation-demo"
      - run: python -m pytest -q tests/test_repository_run.py tests/test_repository_run_wheel.py
      - run: python scripts/run_repository_session_demo.py --out "$RUNNER_TEMP/jev-repository-session-demo"
  python-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[test]"
      - run: python scripts/validate_package.py --check-manifest
      - run: python -m pytest -q tests/test_executable_recipes.py tests/test_executable_runtime.py tests/test_executable_safety.py tests/test_executable_cli.py tests/test_executable_wheel.py tests/test_executable_host_boundaries.py tests/test_executable_source_scope.py tests/test_executable_verification_identity.py tests/test_executable_failure_receipts.py tests/test_executable_source_fidelity.py tests/test_executable_command_receipts.py
      - run: python -m pytest -q tests/test_capabilities.py tests/test_capabilities_adversarial.py tests/test_capabilities_examples.py tests/test_capabilities_cli.py tests/test_capabilities_wheel.py
      - run: python scripts/run_implementation_demo.py --out "$RUNNER_TEMP/jev-python-only-implementation"
      - run: python -m pytest -q tests/test_nomination_inventory.py tests/test_repository_discovery_cli.py tests/test_repository_discovery_wheel.py tests/test_capabilities_bridge_guards.py tests/test_review_gate_invariants.py
      - run: python -m pytest -q tests/test_placement_selection.py tests/test_placement_selection_cli.py tests/test_placement_selection_wheel.py tests/test_inputs_optimizer.py
      - run: python -m pytest -q tests/test_repository_placement_selection.py tests/test_repository_placement_wheel.py tests/test_scope_review_conflicts.py tests/test_placement_review_consistency.py tests/test_placement_review_consistency_cli.py
      - run: python -m pytest -q tests/test_repository_conclusion.py tests/test_repository_conclusion_cli.py tests/test_repository_conclusion_wheel.py
      - run: python -m pytest -q tests/test_repository_run.py tests/test_repository_run_wheel.py
      - run: python scripts/run_repository_session_demo.py --out "$RUNNER_TEMP/jev-python-only-repository-session"
      - run: python -I scripts/run_placement_selection_demo.py --out "$RUNNER_TEMP/jev-python-only-scope"
      - run: python -I scripts/run_repository_conclusion_demo.py --out "$RUNNER_TEMP/jev-python-only-conclusion"
      - run: python scripts/run_selection_demo.py --out "$RUNNER_TEMP/jev-python-only-selection" --verify-synthetic-lifecycle
      - run: python -I scripts/run_capability_demo.py --out "$RUNNER_TEMP/jev-python-only-discovery"
